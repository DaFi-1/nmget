<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>nmGET</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
:root {
  --green: #00ff00;
  --green-light: #66ff66;
  --green-bright: #9dff9d;
  --background: #000000;
  --card-bg: #0a0f0a;
  --input-bg: #060b06;
  --border: #1f3b1f;
  --border-light: #2e5a2e;
  --text: #e5e5e5;
  --text-soft: #5f9a5f;
  --text-dim: #3a5c3a;
  --row-hover: #122012;
}
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html, body {height: 100%;}
body {
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-family: "TerminessNerdFont-Bold", system-ui, -apple-system, sans-serif;
  color: var(--text);
  background: var(--background);
}
img, picture, video, canvas, svg {display: block;max-width: 100%;}
input, button, textarea, select {font: inherit; color: inherit;}
p, h1, h2, h3, h4, h5, h6 { overflow-wrap: break-word;}
a {color: inherit;text-decoration: none;}
ul, ol {list-style: none;}
table {border-collapse: collapse;border-spacing: 0;}
button {background: none;border: none;cursor: pointer;}
#container {
  width:100vw;
  height:100vh;
  display:flex;
}
#container aside {
  width:200px;
  height:100%;
  background-color:var(--background);
  display:flex;
  flex-direction:column;
  padding:16px 12px;
  gap:24px;
  border-right:1px solid var(--border);
  flex-shrink:0;
}
#container aside .brand {
  display:flex;
  align-items:center;
  gap:8px;
  font-size:18px;
  font-weight:700;
  color:var(--text);
  padding:2px 8px;
  letter-spacing:1px;
}
#container aside .brand::before {
  content:"\f095";
  font-family:"TerminessNerdFont-Bold", system-ui, sans-serif;
  font-size:16px;
  color:var(--green);
}
#container aside .brand span {
  color:var(--green);
}
#container aside nav ul {
  display:flex;
  flex-direction:column;
  gap:4px;
}
#container aside nav a {
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:8px;
  font-size:12px;
  letter-spacing:0.6px;
  text-transform:uppercase;
  color:var(--text-soft);
  transition:background 0.2s, color 0.2s;
}
#container aside nav a::before {
  content:"\f111";
  font-family:"TerminessNerdFont-Bold", system-ui, sans-serif;
  font-size:14px;
  width:18px;
  text-align:center;
  color:var(--text-dim);
  transition:color 0.2s;
}
#container aside nav a.icon-dashboard::before { content:"\f0e4"; }
#container aside nav a.icon-nmget::before { content:"\f019"; }
#container aside nav a.icon-config::before { content:"\f013"; }
#container aside nav a:hover {
  background:var(--card-bg);
  color:var(--text);
}
#container aside nav a:hover::before {
  color:var(--text);
}
#container aside nav a.active {
  background:var(--card-bg);
  color:var(--green);
}
#container aside nav a.active::before {
  color:var(--green);
}
#container aside .brand-foot {
  margin-top:auto;
  font-size:10px;
  color:var(--text-dim);
  letter-spacing:0.6px;
  padding:0 8px;
  text-transform:uppercase;
}
#container main {
  width:100%;
  height:100%;
  background-color:var(--background);
}
</style>
  </head>
  <body>
    <div id="container">
      <aside>
        <p class="brand">nm<span>GET</span></p>
        <nav>
          <ul>
            <li><a class="icon-dashboard {{ 'active' if request.endpoint == 'dashboard' else '' }}" href="{{url_for('dashboard')}}">Dashboard</a></li>
            <li><a class="icon-nmget {{ 'active' if request.endpoint == 'nmget' else '' }}" href="{{url_for('nmget')}}">Nmget</a></li>
            <li><a class="icon-config {{ 'active' if request.endpoint == 'config' else '' }}" href="{{url_for('config')}}">Config</a></li>
          </ul>
        </nav>
        <p class="brand-foot">local capture</p>
      </aside>
      <main> {% block content %} {% endblock %}</main>
    </div>
    
  </body>
</html>
