<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" href="data:,">
    <title>nmGET</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ version('css/style.css') }}">
    <link rel="preload" as="font" type="font/ttf" crossorigin href="{{ url_for('static', filename='fonts/TerminessNerdFont-Bold.ttf') }}">
    <link rel="preload" as="font" type="font/ttf" crossorigin href="{{ url_for('static', filename='fonts/TerminessNerdFontMono-Regular.ttf') }}">
</head>
  <body>
    <div id="container">
      <aside>
        <canvas id="matrix-rain"></canvas>
        <p class="brand">nm<span>GET</span></p>
        <nav>
          <ul>
            <li><a class="icon-dashboard {{ 'active' if request.endpoint == 'dashboard' else '' }}" href="{{url_for('dashboard')}}">Dashboard</a></li>
            <li><a class="icon-nmget {{ 'active' if request.endpoint == 'nmget' else '' }}" href="{{url_for('nmget')}}">Nmget</a></li>
            <li><a class="icon-ngenerate {{ 'active' if request.endpoint == 'ngenerate' else '' }}" href="{{url_for('ngenerate')}}">Ngenerate</a></li>
            <li><a class="icon-config {{ 'active' if request.endpoint == 'config' else '' }}" href="{{url_for('config')}}">Config</a></li>
          </ul>
        </nav>
        <p class="brand-foot">local capture</p>
      </aside>
      <main> {% block content %} {% endblock %}</main>
    </div>
    <script>
    (() => {
        const canvas = document.getElementById("matrix-rain");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const aside = canvas.parentElement;
        const chars = "0123456789";
        const fontSize = 14;
        let cols = 0;

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            const w = aside.clientWidth;
            const h = aside.clientHeight;
            canvas.width = Math.floor(w * dpr);
            canvas.height = Math.floor(h * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            cols = Math.max(1, Math.floor(w / fontSize));
        }

        const drops = [];
        function seed() {
            drops.length = 0;
            for (let i = 0; i < cols; i++) {
                drops.push(Math.floor(Math.random() * -40));
            }
        }

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.07)";
            ctx.fillRect(0, 0, aside.clientWidth, aside.clientHeight);
            ctx.font = fontSize + "px TerminessNerdFontMono-Regular, ui-monospace, monospace";
            for (let i = 0; i < cols; i++) {
                const x = i * fontSize;
                const y = drops[i] * fontSize;
                ctx.fillStyle = Math.random() > 0.975 ? "#9dff9d" : "#00ff00";
                ctx.fillText(chars[Math.floor(Math.random() * chars.length)], x, y);
                if (y > aside.clientHeight && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        resize();
        seed();
        window.addEventListener("resize", () => { resize(); seed(); });
        (function loop() {
            draw();
            requestAnimationFrame(loop);
        })();
    })();
    </script>
  </body>
</html>
