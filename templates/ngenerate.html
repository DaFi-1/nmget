{% extends "base.html" %}

{% block content %}
<div id="config">
  <div class="grid">
    <div class="column">
      <section class="component">
        <h2 class="component-title">Generate list</h2>
        <form id="form-config">
          <div class="field">
            <label for="cfg-tag">Tag</label>
            <select id="cfg-tag" name="tag">
              <option value="" selected>Select the tag</option>
            </select>
          </div>
          <div class="field">
            <label for="cfg-quantity">Quantity</label>
            <input id="cfg-quantity" name="quantity" type="number" min="1" max="5000" value="10">
          </div>
          <div class="field">
            <label for="cfg-theme">Background</label>
            <select id="cfg-theme" name="theme">
              <option value="black" selected>Black</option>
              <option value="white">White</option>
            </select>
          </div>
          <button type="submit" id="btn-generate" class="btn-primary">Generate</button>
        </form>
        <p id="cfg-info" class="hint"></p>
      </section>
    </div>

    <div class="column">
      <section class="component component-preview">
        <h2 class="component-title">Preview</h2>
        <iframe id="preview" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox" title="Preview"></iframe>
      </section>

      <section class="component">
        <button id="btn-download" class="btn-primary" disabled>Download all</button>
      </section>
    </div>
  </div>

  <div id="dl-modal" class="modal">
    <div class="modal-box">
      <h2 class="component-title">Download</h2>
      <p id="dl-modal-text"></p>
      <div class="modal-actions">
        <button id="btn-dl-yes" class="btn-primary">Yes</button>
        <button id="btn-dl-no" class="btn-danger">No</button>
      </div>
    </div>
  </div>
</div>

<iframe id="dl-frame" name="dl-frame" style="display:none"></iframe>
<form id="dl-form" method="POST" action="/ngenerate/download" target="dl-frame">
  <input type="hidden" name="payload" id="dl-payload">
</form>

<script>
(() => {
    const form = document.getElementById("form-config");
    const select = document.getElementById("cfg-tag");
    const quantity = document.getElementById("cfg-quantity");
    const theme = document.getElementById("cfg-theme");
    const info = document.getElementById("cfg-info");
    const preview = document.getElementById("preview");
    const btnDownload = document.getElementById("btn-download");
    const btnGenerate = document.getElementById("btn-generate");
    const dlForm = document.getElementById("dl-form");
    const dlPayload = document.getElementById("dl-payload");
    const dlFrame = document.getElementById("dl-frame");
    const dlModal = document.getElementById("dl-modal");
    const dlModalText = document.getElementById("dl-modal-text");
    const btnDlYes = document.getElementById("btn-dl-yes");
    const btnDlNo = document.getElementById("btn-dl-no");

    let generated = { tag: "", numbers: [] };

    const loadTags = () => {
        fetch("/ngenerate/tags")
            .then(r => r.json())
            .then(d => {
                const current = select.value;
                select.innerHTML = '<option value="" selected>Select the tag</option>';
                d.items.forEach(item => {
                    const opt = document.createElement("option");
                    opt.value = item.tag;
                    opt.textContent = `${item.tag} (${item.quantity} available)`;
                    select.appendChild(opt);
                });
                if (d.items.some(i => i.tag === current)) select.value = current;
            });
    };

    form.addEventListener("submit", (e) => {
        e.preventDefault();
        const tag = select.value;
        const qty = Math.max(1, parseInt(quantity.value, 10) || 10);
        if (!tag) {
            info.textContent = "Select a tag.";
            info.style.color = "#ef4444";
            return;
        }
        btnGenerate.disabled = true;
        info.textContent = "Generating...";
        info.style.color = "var(--text-dim)";
        fetch("/ngenerate/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ tag: tag, quantity: qty, dark: theme.value === "black" })
        }).then(r => r.json()).then(d => {
            btnGenerate.disabled = false;
            if (!d.ok) {
                info.textContent = d.error || "Error.";
                info.style.color = "#ef4444";
                return;
            }
            preview.srcdoc = d.html;
            generated = { tag: d.tag, numbers: d.numbers };
            downloading = false;
            btnDownload.disabled = d.count === 0;
            if (d.count > 0) {
                info.textContent = `${d.count} numbers from "${d.tag}".`;
                info.style.color = "var(--green)";
            } else {
                info.textContent = `No pending numbers for "${d.tag}".`;
                info.style.color = "#ef4444";
            }
        });
    });

    let downloading = false;

    const doDownload = () => {
        dlPayload.value = JSON.stringify({
            tag: generated.tag,
            numbers: generated.numbers,
            dark: theme.value === "black"
        });
        dlForm.submit();
        btnDownload.disabled = true;
        downloading = true;
        dlFrame.addEventListener("load", afterDownload, { once: true });
        setTimeout(afterDownload, 1500);
    };

    const afterDownload = () => {
        if (!downloading) return;
        downloading = false;
        preview.srcdoc = "";
        btnDownload.disabled = true;
        info.textContent = "Downloaded. Numbers marked as OFF.";
        info.style.color = "var(--green)";
        loadTags();
    };

    btnDownload.addEventListener("click", () => {
        if (generated.numbers.length === 0) return;
        dlModalText.textContent =
            `Download ${generated.numbers.length} numbers from "${generated.tag}"?`;
        dlModal.classList.add("show");
    });

    btnDlYes.addEventListener("click", () => {
        dlModal.classList.remove("show");
        doDownload();
    });

    btnDlNo.addEventListener("click", () => {
        dlModal.classList.remove("show");
    });

    dlModal.addEventListener("click", (e) => {
        if (e.target === dlModal) dlModal.classList.remove("show");
    });

    loadTags();
})();
</script>

{% endblock %}
