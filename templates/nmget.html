{% extends "base.html" %}

{% block content %}
<div id="nmget">
  <div class="grid">
    <div class="column">
      <section class="component component-script">
        <h2 class="component-title">Generated script</h2>
        <textarea id="script" readonly spellcheck="false"></textarea>
        <button id="btn-copy" class="copy-btn" disabled>Copy</button>
        <p class="hint">Choose the tag and time, activate and copy the script.</p>
      </section>
    </div>

    <div class="column">
      <section class="component">
        <h2 class="component-title">Current tag</h2>
        <p id="current-tag-name">EMPTY</p>
        <button id="btn-delete-tag" class="btn-danger">Delete tag</button>
      </section>

      <section class="component">
        <h2 class="component-title">Add tag</h2>
        <form id="form-add-tag">
          <div class="row">
            <div class="field">
              <label for="new-tag">Tag name</label>
              <input id="new-tag" name="new-tag" type="text" maxlength="50" placeholder="New tag name">
            </div>
            <button type="submit" class="btn-primary btn-add">Add</button>
          </div>
        </form>
        <p id="add-tag-msg" class="hint"></p>
      </section>

      <section class="component">
        <h2 class="component-title">Configuration</h2>
        <form id="form-nmget">
          <div class="row">
            <div class="field">
              <label for="tag">Tag</label>
              <select id="tag" name="tag">
                <option value="" selected>Select the tag</option>
              </select>
            </div>
            <div class="field">
              <label for="duration">Duration</label>
              <select id="duration" name="duration">
                <option value="10">10s</option>
                <option value="20">20s</option>
                <option value="60">60s</option>
                <option value="300">5m</option>
                <option value="600">10m</option>
                <option value="1800">30m</option>
                <option value="3600">1h</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn-primary">Activate script</button>
        </form>
      </section>
    </div>

    <div class="column">
      <section class="component component-stats">
        <div class="stats-head">
          <h2 class="component-title">Capture queue</h2>
          <span>Total: <span id="stats-total">0</span></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Tag</th>
                <th>Quantity</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="stats-body"></tbody>
          </table>
        </div>
        <div class="stats-actions">
          <button id="btn-send-all" class="btn-send">Send all</button>
          <button id="btn-delete-all" class="btn-delete">Delete all</button>
        </div>
      </section>
    </div>
  </div>

  <div id="confirm-modal" class="modal">
    <div class="modal-box">
      <h2 class="component-title">Confirm</h2>
      <p id="confirm-text"></p>
      <div class="modal-actions">
        <button id="btn-confirm-yes" class="btn-primary">Yes</button>
        <button id="btn-confirm-no" class="btn-danger">No</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
    const form = document.getElementById("form-nmget");
    const tag = document.getElementById("tag");
    const duration = document.getElementById("duration");
    const scriptEl = document.getElementById("script");
    const btnCopy = document.getElementById("btn-copy");
    const currentTagName = document.getElementById("current-tag-name");
    const btnDeleteTag = document.getElementById("btn-delete-tag");
    const statsBody = document.getElementById("stats-body");
    const statsTotal = document.getElementById("stats-total");
    const btnSendAll = document.getElementById("btn-send-all");
    const btnDeleteAll = document.getElementById("btn-delete-all");
    const formAddTag = document.getElementById("form-add-tag");
    const newTag = document.getElementById("new-tag");
    const addTagMsg = document.getElementById("add-tag-msg");
    const confirmModal = document.getElementById("confirm-modal");
    const confirmText = document.getElementById("confirm-text");
    const btnConfirmYes = document.getElementById("btn-confirm-yes");
    const btnConfirmNo = document.getElementById("btn-confirm-no");

    const askConfirm = (message, onYes) => {
        confirmText.textContent = message;
        confirmModal.classList.add("show");
        btnConfirmYes.onclick = () => {
            confirmModal.classList.remove("show");
            onYes();
        };
        btnConfirmNo.onclick = () => confirmModal.classList.remove("show");
        confirmModal.onclick = (e) => {
            if (e.target === confirmModal) confirmModal.classList.remove("show");
        };
    };

    let prevStats = "";

    const loadTags = () => {
        fetch("/tags")
            .then(r => r.json())
            .then(d => {
                const current = tag.value;
                tag.innerHTML = '<option value="" selected>Select the tag</option>';
                d.tags.forEach(t => {
                    const opt = document.createElement("option");
                    opt.value = t;
                    opt.textContent = t;
                    tag.appendChild(opt);
                });
                if (d.tags.includes(current)) tag.value = current;
                update();
            });
    };

    formAddTag.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = newTag.value.trim();
        if (!name) return;
        fetch("/tags", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: name })
        }).then(r => r.json()).then(d => {
            if (d.ok) {
                newTag.value = "";
                addTagMsg.textContent = `Tag "${d.name}" added.`;
                addTagMsg.style.color = "var(--green)";
                tag.value = d.name;
                loadTags();
            } else {
                addTagMsg.textContent = d.error === "duplicate"
                    ? "Tag already exists."
                    : (d.error || "Error.");
                addTagMsg.style.color = "#ef4444";
            }
        });
    });

    const escapeHtml = (v) => String(v)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");

    const renderStats = (d) => {
        statsBody.innerHTML = "";
        let total = 0;
        d.items.forEach((item, i) => {
            total += item.quantity;
            const tr = document.createElement("tr");
            tr.style.animationDelay = `${i * 60}ms`;
            tr.innerHTML =
                `<td>${escapeHtml(item.tag)}</td>` +
                `<td class="num" data-value="${escapeHtml(item.quantity)}">0</td>` +
                `<td><div class="row-actions">` +
                `<button class="btn-row btn-row-add" data-tag="${escapeHtml(item.tag)}">Add</button>` +
                `<button class="btn-row btn-row-del" data-tag="${escapeHtml(item.tag)}">Delete</button>` +
                `</div></td>`;
            statsBody.appendChild(tr);
        });
        statsTotal.textContent = total;
        if (d.items.length === 0) {
            const tr = document.createElement("tr");
            tr.innerHTML = '<td class="empty" colspan="3">Empty queue</td>';
            statsBody.appendChild(tr);
        }
        document.querySelectorAll("#stats-body .num").forEach(el => {
            const target = parseInt(el.dataset.value, 10);
            let n = 0;
            const step = Math.max(1, Math.ceil(target / 30));
            const timer = setInterval(() => {
                n += step;
                if (n >= target) { n = target; clearInterval(timer); }
                el.textContent = n;
            }, 30);
        });
    };

    const loadStats = () => {
        fetch("/queue")
            .then(r => r.json())
            .then(d => {
                const current = JSON.stringify(d.items);
                if (current === prevStats) return;
                prevStats = current;
                renderStats(d);
            });
    };

    statsBody.addEventListener("click", (e) => {
        const button = e.target.closest(".btn-row");
        if (!button) return;
        const tag = button.dataset.tag;
        const isAdd = button.classList.contains("btn-row-add");
        const route = isAdd ? "/queue/send" : "/queue/clear";
        askConfirm(
            isAdd
                ? `Move all "${tag}" numbers to the list?`
                : `Delete all "${tag}" numbers from the queue?`,
            () => fetch(route, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ tag: tag })
            }).then(loadStats)
        );
    });

    btnSendAll.addEventListener("click", () => {
        askConfirm("Send all numbers in the queue to the list?", () => {
            fetch("/queue/send", { method: "POST" }).then(loadStats);
        });
    });

    btnDeleteAll.addEventListener("click", () => {
        askConfirm("Delete all numbers from the queue?", () => {
            fetch("/queue/clear", { method: "POST" }).then(loadStats);
        });
    });

    const loadCurrentTag = () => {
        fetch("/tag/current")
            .then(r => r.json())
            .then(d => { currentTagName.textContent = d.tag; });
    };

    btnDeleteTag.addEventListener("click", () => {
        askConfirm("Delete the current tag?", () => {
            fetch("/tag/current", { method: "DELETE" })
                .then(r => r.json())
                .then(d => { currentTagName.textContent = d.tag; });
        });
    });

    const generate = () => {
        const t = tag.value;
        const seg = Math.max(1, parseInt(duration.value, 10) || 10);
        const safeTag = t.replace(/\\/g, "\\\\").replace(/"/g, '\\"').replace(/\n/g, "\\n");
        scriptEl.value = `(() => {
    const REPEAT_INTERVAL = 2000;        // 2 seconds
    const END_TIME = ${seg * 1000}; // ${seg} seconds
    const TAG = "${safeTag}";

    const interval = setInterval(() => {
        const html = document.documentElement.outerHTML;

        const phones = [
            ...html.matchAll(
                /(\\(\\d{2}\\)\\s*\\d{4,5}-\\d{4})/gi
            )
        ].map(m => m[1].replace(/\\D/g, ""));

        if (phones.length > 0) {
            fetch("http://127.0.0.1:5000/phones", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    phones: phones,
                    tag: TAG
                })
            });
        }
    }, REPEAT_INTERVAL);

    setTimeout(() => {
        clearInterval(interval);
    }, END_TIME);
})();`;
    };

    const validate = () => {
        const seg = parseInt(duration.value, 10);
        const filled = tag.value !== "" && Number.isFinite(seg) && seg > 0;
        btnCopy.disabled = !(activated && filled);
    };

    let activated = false;

    form.addEventListener("submit", (e) => {
        e.preventDefault();
        fetch("/nmget", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                tag: tag.value
            })
        }).then(() => loadCurrentTag());
        activated = true;
        generate();
        validate();
    });

    const update = () => {
        generate();
        validate();
    };

    tag.addEventListener("change", update);
    duration.addEventListener("change", update);

    update();
    loadTags();
    loadCurrentTag();
    loadStats();
    setInterval(loadStats, 2000);

    btnCopy.addEventListener("click", () => {
        if (btnCopy.disabled) return;
        navigator.clipboard.writeText(scriptEl.value);
        btnCopy.textContent = "Copied!";
        setTimeout(() => { btnCopy.textContent = "Copy"; }, 1500);
    });
})();
</script>

{% endblock %}
