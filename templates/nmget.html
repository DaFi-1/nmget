{% extends "base.html" %}

{% block content %}
<style>
#nmget {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 20px;
  overflow: hidden;
}

.grid {
  display: grid;
  grid-template-columns: 360px 360px 1fr;
  gap: 16px;
  flex: 1;
  min-height: 0;
  align-items: stretch;
}

.column {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 0;
  min-height: 0;
}

.component {
  background: var(--card-bg);
  border: 1px solid #00ff00;
  border-radius: 12px;
  padding: 16px 18px;
}

.component-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-soft);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.component-title::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 2px;
  background: var(--green);
}

/* form */
#form-nmget {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.field {
  flex: 1;
  min-width: 140px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field label {
  font-size: 11px;
  color: var(--text-soft);
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

.field select,
.field input {
  background: var(--input-bg);
  border: 1px solid #00ff00;
  border-radius: 10px;
  color: var(--text);
  padding: 10px 12px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
}

.field select:focus,
.field input:focus {
  border-color: var(--green);
  background: var(--input-bg);
}

.btn-primary {
  background: var(--green-light);
  color: #000;
  font-weight: 700;
  padding: 12px;
  border-radius: 10px;
  font-size: 14px;
  transition: background 0.2s;
}

.btn-primary:hover {
  background: var(--green-bright);
}

/* current tag */
#current-tag-name {
  font-size: 18px;
  color: var(--green);
  font-weight: 700;
  margin-bottom: 12px;
  word-break: break-word;
}

.btn-danger {
  background: #ef4444;
  color: #fff;
  font-weight: 600;
  padding: 10px;
  border-radius: 10px;
  font-size: 13px;
  transition: background 0.2s;
  width: 100%;
}

.btn-danger:hover {
  background: #dc2626;
}

/* script */
.component-script {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

#script {
  width: 100%;
  flex: 1;
  min-height: 120px;
  resize: vertical;
  background: var(--input-bg);
  border: 1px solid #00ff00;
  border-radius: 10px;
  color: var(--green);
  font-family: "TerminessNerdFontMono-Regular", ui-monospace, monospace;
  font-size: 12px;
  line-height: 1.6;
  padding: 14px;
  outline: none;
}

.copy-btn {
  width: 100%;
  background: var(--text-dim);
  color: var(--text);
  border: none;
  border-radius: 10px;
  padding: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: not-allowed;
  opacity: 0.5;
  transition: all 0.2s;
  margin-top: 12px;
}

.copy-btn:enabled {
  background: var(--green-light);
  color: #000;
  opacity: 1;
  cursor: pointer;
}

.copy-btn:enabled:hover {
  background: var(--green-bright);
}

.hint {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 10px;
}

/* stats */
.component-stats {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}

.stats-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.stats-head .component-title {
  margin-bottom: 0;
}

#stats-total {
  color: var(--green);
  font-weight: 700;
  font-size: 14px;
}

.table-wrap {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  text-align: left;
  padding: 10px 12px;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
}

thead th {
  color: var(--text-soft);
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.8px;
  position: sticky;
  top: 0;
  background: var(--card-bg);
}

tbody tr {
  animation: slideIn 0.35s ease both;
}

tbody tr:hover {
  background: var(--row-hover);
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: none; }
}

.num {
  color: var(--green);
  text-align: right;
  font-weight: 700;
}

.empty {
  color: var(--text-dim);
  text-align: center;
  padding: 24px 0;
  font-size: 13px;
}

.stats-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.stats-actions button {
  flex: 1;
  font-size: 13px;
  font-weight: 600;
  padding: 10px;
  border-radius: 10px;
  transition: all 0.2s;
}

.row-actions {
  display: flex;
  gap: 6px;
  justify-content: flex-end;
}

.btn-row {
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 6px;
  transition: all 0.2s;
}

.btn-row-add {
  background: var(--green-light);
  color: #000;
}

.btn-row-add:hover {
  background: var(--green-bright);
}

.btn-row-del {
  background: transparent;
  border: 1px solid #ef4444;
  color: #ef4444;
}

.btn-row-del:hover {
  background: #ef4444;
  color: #fff;
}

.btn-send {
  background: var(--green-light);
  color: #000;
}

.btn-send:hover {
  background: var(--green-bright);
}

.btn-delete {
  background: transparent;
  border: 1px solid #ef4444;
  color: #ef4444;
}

.btn-delete:hover {
  background: #ef4444;
  color: #fff;
}

@media (max-width: 1200px) {
  .grid {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 900px) {
  #nmget {
    height: auto;
    overflow: visible;
  }
  .grid {
    grid-template-columns: 1fr;
    flex: none;
  }
  .component-script {
    flex: none;
  }
  #script {
    flex: none;
    min-height: 220px;
  }
  .component-stats {
    min-height: 400px;
  }
}
</style>

<div id="nmget">
  <div class="grid">
    <div class="column">
      <section class="component component-script">
        <h2 class="component-title">Generated script</h2>
        <textarea id="script" readonly spellcheck="false"></textarea>
        <button id="btn-copy" class="copy-btn" disabled>Copy</button>
        <p class="hint">Choose the tag and time, activate and copy the script.</p>
      </section>
    </div>

    <div class="column">
      <section class="component">
        <h2 class="component-title">Current tag</h2>
        <p id="current-tag-name">EMPTY</p>
        <button id="btn-delete-tag" class="btn-danger">Delete tag</button>
      </section>

      <section class="component">
        <h2 class="component-title">Configuration</h2>
        <form id="form-nmget">
          <div class="row">
            <div class="field">
              <label for="tag">Tag</label>
              <select id="tag" name="tag">
                <option value="" selected>Select the tag</option>
                <option value="AÇAÍ SHOP">AÇAÍ SHOP</option>
                <option value="AUTO PARTS">AUTO PARTS</option>
                <option value="AUTO REPAIR">AUTO REPAIR</option>
                <option value="BAKERY">BAKERY</option>
                <option value="BANK">BANK</option>
                <option value="BAR">BAR</option>
                <option value="BEAUTY SALON">BEAUTY SALON</option>
                <option value="BICYCLE SHOP">BICYCLE SHOP</option>
                <option value="BOOKSTORE">BOOKSTORE</option>
                <option value="BOUTIQUE">BOUTIQUE</option>
                <option value="BROKERAGE">BROKERAGE</option>
                <option value="CANDY SHOP">CANDY SHOP</option>
                <option value="CAR DEALERSHIP">CAR DEALERSHIP</option>
                <option value="CARPENTRY">CARPENTRY</option>
                <option value="CLINIC">CLINIC</option>
                <option value="CLOTHING STORE">CLOTHING STORE</option>
                <option value="COFFEE SHOP">COFFEE SHOP</option>
                <option value="CONSTRUCTION">CONSTRUCTION</option>
                <option value="DENTIST">DENTIST</option>
                <option value="DISTRIBUTOR">DISTRIBUTOR</option>
                <option value="ELECTRONICS">ELECTRONICS</option>
                <option value="FLOWER SHOP">FLOWER SHOP</option>
                <option value="FREIGHT COMPANY">FREIGHT COMPANY</option>
                <option value="GARDENING">GARDENING</option>
                <option value="GROCERY STORE">GROCERY STORE</option>
                <option value="GYM">GYM</option>
                <option value="HARDWARE STORE">HARDWARE STORE</option>
                <option value="HOTEL">HOTEL</option>
                <option value="LANGUAGE SCHOOL">LANGUAGE SCHOOL</option>
                <option value="MARKET">MARKET</option>
                <option value="MEDICAL OFFICE">MEDICAL OFFICE</option>
                <option value="NIGHTCLUB">NIGHTCLUB</option>
                <option value="NGO">NGO</option>
                <option value="OPTICAL">OPTICAL</option>
                <option value="PARTY SUPPLIES">PARTY SUPPLIES</option>
                <option value="PASTRY SHOP">PASTRY SHOP</option>
                <option value="PET SHOP">PET SHOP</option>
                <option value="PHARMACY">PHARMACY</option>
                <option value="PIZZERIA">PIZZERIA</option>
                <option value="PREP SCHOOL">PREP SCHOOL</option>
                <option value="REAL ESTATE">REAL ESTATE</option>
                <option value="RESTAURANT">RESTAURANT</option>
                <option value="SHOE STORE">SHOE STORE</option>
                <option value="SNACK BAR">SNACK BAR</option>
                <option value="STEAKHOUSE">STEAKHOUSE</option>
                <option value="SUPERMARKET">SUPERMARKET</option>
                <option value="TOY STORE">TOY STORE</option>
                <option value="TRAVEL AGENCY">TRAVEL AGENCY</option>
                <option value="VETERINARY">VETERINARY</option>
                <option value="WINE SHOP">WINE SHOP</option>
              </select>
            </div>
            <div class="field">
              <label for="duration">Duration</label>
              <select id="duration" name="duration">
                <option value="10">10s</option>
                <option value="20">20s</option>
                <option value="60">60s</option>
                <option value="300">5m</option>
                <option value="600">10m</option>
                <option value="1800">30m</option>
                <option value="3600">1h</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn-primary">Activate script</button>
        </form>
      </section>
    </div>

    <div class="column">
      <section class="component component-stats">
        <div class="stats-head">
          <h2 class="component-title">Capture queue</h2>
          <span>Total: <span id="stats-total">0</span></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Tag</th>
                <th>Quantity</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="stats-body"></tbody>
          </table>
        </div>
        <div class="stats-actions">
          <button id="btn-send-all" class="btn-send">Send all</button>
          <button id="btn-delete-all" class="btn-delete">Delete all</button>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
(() => {})();
</script>

{% endblock %}
