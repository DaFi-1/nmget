{% extends "base.html" %}

{% block content %}
<div id="dashboard">
  <div class="grid grid-cards">
    <section class="component">
      <p class="card-label">Total numbers</p>
      <p id="card-total" class="card-value">0</p>
    </section>
    <section class="component">
      <p class="card-label">Pending (ON)</p>
      <p id="card-on" class="card-value">0</p>
    </section>
    <section class="component">
      <p class="card-label">Sent (OFF)</p>
      <p id="card-off" class="card-value">0</p>
    </section>
    <section class="component">
      <p class="card-label">Captured today</p>
      <p id="card-today" class="card-value">0</p>
    </section>
    <section class="component">
      <p class="card-label">Distinct tags</p>
      <p id="card-tags" class="card-value">0</p>
    </section>
    <section class="component">
      <p class="card-label">Last capture</p>
      <p id="card-last" class="card-value" style="font-size:16px">—</p>
    </section>
  </div>

  <div class="grid grid-charts">
    <section class="component">
      <h2 class="component-title">Overall status</h2>
      <div class="chart-wrap"><canvas id="chart-status"></canvas></div>
    </section>
    <section class="component">
      <h2 class="component-title">Status by tag</h2>
      <div class="chart-wrap"><canvas id="chart-status-tag"></canvas></div>
    </section>
  </div>

  <div class="grid grid-charts">
    <section class="component">
      <h2 class="component-title">Numbers by tag</h2>
      <div class="chart-wrap"><canvas id="chart-tag"></canvas></div>
    </section>
    <section class="component">
      <h2 class="component-title">Captures per day</h2>
      <div class="chart-wrap"><canvas id="chart-day"></canvas></div>
    </section>
  </div>
</div>

<script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}?v={{ version('vendor/chart.umd.min.js') }}"></script>
<script>
(() => {
    const COR_ON = "#00ff00";
    const COR_OFF = "#4d4d4d";

    const FONT = "TerminessNerdFont-Bold, system-ui, sans-serif";

    const cardTotal = document.getElementById("card-total");
    const cardOn = document.getElementById("card-on");
    const cardOff = document.getElementById("card-off");
    const cardToday = document.getElementById("card-today");
    const cardTags = document.getElementById("card-tags");
    const cardLast = document.getElementById("card-last");

    Chart.defaults.color = "#5f9a5f";
    Chart.defaults.font.family = FONT;
    Chart.defaults.maintainAspectRatio = false;

    const chartStatus = new Chart(document.getElementById("chart-status"), {
        type: "doughnut",
        data: {
            labels: ["ON (not sent)", "OFF (sent)"],
            datasets: [{ data: [0, 0], backgroundColor: [COR_ON, COR_OFF] }]
        },
        options: {
            cutout: "60%",
            plugins: { legend: { position: "right" } }
        }
    });

    const chartStatusTag = new Chart(document.getElementById("chart-status-tag"), {
        type: "bar",
        data: {
            labels: [],
            datasets: [
                { label: "ON", data: [], backgroundColor: COR_ON },
                { label: "OFF", data: [], backgroundColor: COR_OFF }
            ]
        },
        options: {
            plugins: { legend: { position: "top" } },
            scales: {
                y: { beginAtZero: true, stacked: true, grid: { color: "#1f3b1f" }, ticks: { precision: 0 } },
                x: { stacked: true, grid: { display: false } }
            }
        }
    });

    const chartTag = new Chart(document.getElementById("chart-tag"), {
        type: "bar",
        data: { labels: [], datasets: [{ label: "Numbers", data: [], backgroundColor: "#00ff00" }] },
        options: {
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, grid: { color: "#1f3b1f" }, ticks: { precision: 0 } },
                x: { grid: { display: false } }
            }
        }
    });

    const chartDay = new Chart(document.getElementById("chart-day"), {
        type: "line",
        data: { labels: [], datasets: [{
            label: "Captures",
            data: [],
            borderColor: "#00ff00",
            backgroundColor: "rgba(0, 255, 0, 0.15)",
            fill: true,
            tension: 0.3,
            pointRadius: 2
        }] },
        options: {
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, grid: { color: "#1f3b1f" }, ticks: { precision: 0 } },
                x: { grid: { display: false } }
            }
        }
    });

    const formatDate = (v) => {
        if (!v) return "—";
        const [date, time] = v.split(" ");
        const [y, m, d] = date.split("-");
        return `${d}/${m}/${y} ${time}`;
    };

    let lastKey = "";

    const load = () => {
        fetch("/dashboard/data")
            .then(r => r.json())
            .then(d => {
                const key = JSON.stringify(d);
                if (key === lastKey) return;
                lastKey = key;

                cardTotal.textContent = d.total;
                cardToday.textContent = d.today;
                cardTags.textContent = d.by_tag.length;
                cardLast.textContent = formatDate(d.last_capture);

                const byStatus = new Map(d.by_status.map(s => [s.status, s.quantity]));
                const on = byStatus.get("ON") || 0;
                const off = byStatus.get("OFF") || 0;
                cardOn.textContent = on;
                cardOff.textContent = off;

                chartStatus.data.datasets[0].data = [on, off];
                chartStatus.update();

                const map = {};
                d.status_by_tag.forEach(x => {
                    if (!map[x.tag]) map[x.tag] = { on: 0, off: 0 };
                    if (x.status === "ON") map[x.tag].on += x.quantity;
                    else map[x.tag].off += x.quantity;
                });
                chartStatusTag.data.labels = d.by_tag.map(t => t.tag);
                chartStatusTag.data.datasets[0].data = d.by_tag.map(t => map[t.tag] ? map[t.tag].on : 0);
                chartStatusTag.data.datasets[1].data = d.by_tag.map(t => map[t.tag] ? map[t.tag].off : 0);
                chartStatusTag.update();

                chartTag.data.labels = d.by_tag.map(t => t.tag);
                chartTag.data.datasets[0].data = d.by_tag.map(t => t.quantity);
                chartTag.update();

                chartDay.data.labels = d.by_date.map(x => x.date);
                chartDay.data.datasets[0].data = d.by_date.map(x => x.quantity);
                chartDay.update();
            });
    };

    load();
    setInterval(load, 5000);
})();
</script>

{% endblock %}
