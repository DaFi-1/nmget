{% extends "base.html" %}

{% block content %}
<style>
#dashboard {
  height: 100%;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow-y: auto;
}

.grid {
  display: grid;
  gap: 16px;
}

.grid-cards {
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
}

.grid-charts {
  flex: 1;
  min-height: 0;
  grid-template-columns: repeat(2, 1fr);
}

.component {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
}

.component-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-soft);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.component-title::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 2px;
  background: var(--green);
}

.card-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--green);
}

.card-label {
  font-size: 12px;
  color: var(--text-soft);
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

.chart-wrap {
  flex: 1;
  position: relative;
  min-height: 0;
}

@media (max-width: 900px) {
  #dashboard {
    height: auto;
  }
  .grid-charts {
    grid-template-columns: 1fr;
  }
  .chart-wrap {
    min-height: 260px;
  }
}
</style>

<div id="dashboard">
  <div class="grid grid-cards">
    <section class="component">
      <p class="card-label">Total numbers</p>
      <p id="card-total" class="card-value">0</p>
    </section>
    <section class="component">
      <p class="card-label">Pending (ON)</p>
      <p id="card-on" class="card-value">0</p>
    </section>
    <section class="component">
      <p class="card-label">Sent (OFF)</p>
      <p id="card-off" class="card-value">0</p>
    </section>
    <section class="component">
      <p class="card-label">Captured today</p>
      <p id="card-today" class="card-value">0</p>
    </section>
    <section class="component">
      <p class="card-label">Distinct tags</p>
      <p id="card-tags" class="card-value">0</p>
    </section>
    <section class="component">
      <p class="card-label">Last capture</p>
      <p id="card-last" class="card-value" style="font-size:16px">—</p>
    </section>
  </div>

  <div class="grid grid-charts">
    <section class="component">
      <h2 class="component-title">Overall status</h2>
      <div class="chart-wrap"><canvas id="chart-status"></canvas></div>
    </section>
    <section class="component">
      <h2 class="component-title">Status by tag</h2>
      <div class="chart-wrap"><canvas id="chart-status-tag"></canvas></div>
    </section>
  </div>

  <div class="grid grid-charts">
    <section class="component">
      <h2 class="component-title">Numbers by tag</h2>
      <div class="chart-wrap"><canvas id="chart-tag"></canvas></div>
    </section>
    <section class="component">
      <h2 class="component-title">Captures per day</h2>
      <div class="chart-wrap"><canvas id="chart-day"></canvas></div>
    </section>
  </div>
</div>



{% endblock %}
